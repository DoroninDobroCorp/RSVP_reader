server {
    listen 443 ssl;
    server_name hummingread.145.239.82.124.sslip.io;
    ssl_certificate /etc/letsencrypt/live/hummingread.145.239.82.124.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hummingread.145.239.82.124.sslip.io/privkey.pem;
    root /srv/hummingread/current/dist/about;
    index index.html;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://145.239.82.124.sslip.io; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
}
