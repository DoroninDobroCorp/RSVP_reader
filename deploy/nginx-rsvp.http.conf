# Include from nginx's http {} block before the RSVP server block.
limit_req_zone $binary_remote_addr zone=hummingread_article_rate:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=hummingread_article_conn:10m;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain;
