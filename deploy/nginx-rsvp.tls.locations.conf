# HUMMINGREAD_RSVP_BEGIN
    location = /rsvp {
        return 301 /rsvp/;
    }

    location = /rsvp/api/sync {
        proxy_pass http://127.0.0.1:8081/api/sync;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        add_header Cache-Control "no-store" always;
    }

    location = /rsvp/api/article {
        proxy_pass http://127.0.0.1:8081/api/article;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        client_max_body_size 32k;
        add_header Cache-Control "no-store" always;
    }

    location = /rsvp/service-worker.js {
        alias /srv/hummingread/current/dist/service-worker.js;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Type "application/javascript; charset=utf-8" always;
    }

    location = /apple-touch-icon.png {
        alias /srv/hummingread/current/dist/assets/icons/app-icon-180.png;
    }

    location = /apple-touch-icon-precomposed.png {
        alias /srv/hummingread/current/dist/assets/icons/app-icon-180.png;
    }

    location /rsvp/ {
        alias /srv/hummingread/current/dist/;
        index index.html;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
# HUMMINGREAD_RSVP_END
