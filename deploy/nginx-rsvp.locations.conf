# Include inside the existing TLS server {} block.
# Static files are served only from the deterministic public build.
location = /rsvp/api/article {
    if ($request_method != POST) { return 405; }

    access_log off;
    client_max_body_size 8k;
    limit_req zone=hummingread_article_rate burst=3 nodelay;
    limit_conn hummingread_article_conn 2;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_send_timeout 8s;
    proxy_read_timeout 20s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:8081/api/article;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

location = /rsvp/api/sync { return 404; }

location ~ ^/rsvp/(?:\.git|data|node_modules|tests?|ios|deploy|docs)(?:/|$) { return 404; }
location ~ ^/rsvp/(?:server\.js|package(?:-lock)?\.json|AGENTS\.md|MASTER_MISSION\.md|FOLLOWUP_MISSION\.md)$ { return 404; }
location ~* ^/rsvp/.*\.(?:epub|fb2|docx|rtf|pem|key|env)$ { return 404; }

location /rsvp/ {
    alias /srv/RSVP_reader/dist/;
    try_files $uri $uri/ /rsvp/index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
