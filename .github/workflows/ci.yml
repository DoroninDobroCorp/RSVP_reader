name: release-gates

on:
  pull_request:
  push:
    branches: [main, "integration/**", "release/**"]

permissions:
  contents: read

jobs:
  web-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm audit --omit=dev
      - run: npm run test:unit
      - run: npm run test:production
      - run: npm run test:extension
      - run: npm run test:visual
      - run: npm run test:lighthouse
      - run: npm run build:all
      - run: npx cap copy ios
      - run: npm run verify:all
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: hummingread-web-and-extension
          path: |
            dist/
            artifacts/lighthouse-summary.json
            docs/THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  unsigned-ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cap:sync
      - run: npx cap doctor
      - run: npx cap ls
      - run: plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO analyze
      - run: npm run verify:package
      - run: git diff --check
